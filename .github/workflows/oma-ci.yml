name: OMA integration checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/oma-five-agent-integration]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript and Wrangler dry-run checks
        run: npm run check
      - name: Run tests
        run: npm test -- --run
